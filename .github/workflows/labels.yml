# Refresh official medicine label sections (openFDA) into content/labels/ once a week.
# The app reads these static files; it never calls openFDA at runtime.
name: Medicine labels

on:
  schedule:
    - cron: '17 3 * * 1'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  labels:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - run: node scripts/fetch-labels.mjs
      - name: Commit changes
        run: |
          if [ -n "$(git status --porcelain content/labels)" ]; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add content/labels
            git commit -m "Refresh medicine labels from openFDA"
            git push
          fi
