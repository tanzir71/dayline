# End-to-end tests (Playwright, including offline) and the Lighthouse accessibility check on every push.
name: Test

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  e2e:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - run: npm ci

      - run: npm run check

      - run: npx playwright install --with-deps chromium

      - name: Playwright (smoke, install sheet, offline, installability)
        run: npm run test:e2e

      - name: Bundle budget (/app/ ≤ 200 KB gzipped JS without the PDF code)
        run: npm run budget

      - name: Lighthouse accessibility (≥ 95 on every page)
        run: npm run lighthouse
        env:
          CHROME_PATH: /usr/bin/google-chrome

      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-report
          path: test-results/
          retention-days: 7
