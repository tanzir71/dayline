# Build the Astro site and deploy it to GitHub Pages on every push to main.
# Repo settings → Pages → Source: "GitHub Actions".
# Works before M0-01 scaffolding exists? No — this needs package.json; the first task of M0 creates it.
name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - id: pages
        uses: actions/configure-pages@v5

      - run: npm ci

      - name: Check (types, lint, unit tests, content rules)
        run: npm run check

      - name: Fetch latest Android release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir -p public/android
          gh release download --repo tanzir71/dayline-android \
            --pattern 'dayline-*.apk' --pattern 'latest.json' \
            --dir public/android --clobber || echo "No Android release yet"

      - name: Build
        run: npm run build
        env:
          # e.g. https://user.github.io and /repo-name, or https://dayline.app and empty
          PUBLIC_SITE_URL: ${{ steps.pages.outputs.origin }}
          PUBLIC_BASE_PATH: ${{ steps.pages.outputs.base_path }}

      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
